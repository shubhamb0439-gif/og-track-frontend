<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIDA face demo</title>
<style>
:root{--bg:#f3f3f3;--text:#2b2b2b;--muted:#6b6b6b;--glass:rgba(255,255,255,0.32);--glass-b:rgba(255,255,255,0.6);--line:70,70,70;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1e;--text:#ececec;--muted:#a0a0a0;--glass:rgba(40,40,44,0.45);--glass-b:rgba(255,255,255,0.14);--line:215,215,215;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1c1e;--text:#ececec;--muted:#a0a0a0;--glass:rgba(40,40,44,0.45);--glass-b:rgba(255,255,255,0.14);--line:215,215,215;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#stage{position:relative;width:100%;height:100%;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%}
#logo{position:absolute;z-index:2;cursor:pointer}
#hints{position:absolute;width:100%;text-align:center;z-index:2;pointer-events:none;transition:opacity .5s;color:var(--muted);font-size:14px}
#hints p{margin:0 0 12px}
#ask{position:absolute;top:16px;left:16px;z-index:4;padding:10px 18px;border-radius:999px;border:1px solid var(--glass-b);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--text);font:inherit;font-size:14px;cursor:pointer}
.glass{position:absolute;width:min(300px,80vw);background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);border:1px solid var(--glass-b);border-radius:16px;box-shadow:0 8px 32px rgba(31,38,60,0.18);z-index:3}
.fh{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--glass-b);font-size:13px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:#8a8a8a}
.fb{padding:12px 16px;font-size:15px;line-height:1.55;min-height:70px}
</style></head><body>
