<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>OG Track — To-Do List</title>
<script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.2/dist/socket.io.min.js"></script>
<script>if(typeof io==='undefined')window.io=()=>({on:()=>{},emit:()=>{}});</script>
<style>
  :root{--red:#C0392B;--red2:#E74C3C;--bg:#F5F6FA;--white:#fff;--border:#E8E8E8;--g2:#2C3E50;--g3:#7F8C8D;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  body{background:var(--bg);min-height:100vh;color:var(--g2);}
  .topbar{background:linear-gradient(135deg,#2C3E50,#233140);color:#fff;padding:0 24px;height:58px;
    display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .topbar h1{font-size:16px;font-weight:700;}
  .topbar a{color:#fff;text-decoration:none;font-size:13px;background:rgba(255,255,255,.15);
    padding:6px 14px;border-radius:6px;}
  .topbar a:hover{background:rgba(255,255,255,.25);}
  .content{max-width:920px;margin:0 auto;padding:28px 20px;}

  .tdl-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .tdl-filters{display:flex;gap:8px;}
  .tdl-filter{padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:#fff;
    font-size:12.5px;font-weight:600;color:var(--g3);cursor:pointer;}
  .tdl-filter.active{background:var(--red);color:#fff;border-color:var(--red);}
  .tdl-btn-primary{background:var(--red);color:#fff;border:none;padding:9px 18px;border-radius:8px;
    font-size:13px;font-weight:700;cursor:pointer;}
  .tdl-btn-primary:hover{opacity:.9;}
  .tdl-status{color:var(--red);font-size:13px;margin-bottom:10px;}

  .tdl-list{display:flex;flex-direction:column;gap:10px;}
  .tdl-row{background:#fff;border-radius:12px;border:1px solid rgba(11,11,11,.06);
    box-shadow:0 1px 2px rgba(20,20,30,.04);padding:14px 16px;display:flex;align-items:center;
    justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .tdl-row.done{opacity:.6;}
  .tdl-row.done .tdl-row-title{text-decoration:line-through;}
  .tdl-row-left{display:flex;align-items:flex-start;gap:12px;flex:1;min-width:220px;}
  .tdl-row-left input[type=checkbox]{margin-top:4px;width:18px;height:18px;cursor:pointer;accent-color:var(--red);}
  .tdl-row-title{font-size:14px;font-weight:600;}
  .tdl-row-meta{font-size:12px;color:var(--g3);margin-top:3px;}
  .tdl-row-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .tdl-badge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px;}
  .tdl-badge.prio-high{background:#fdecea;color:#c0392b;}
  .tdl-badge.prio-normal{background:#eef1f4;color:#7f8c8d;}
  .tdl-badge.prio-low{background:#eafaf1;color:#27ae60;}
  .tdl-badge.status-pending{background:#fdf2e3;color:#b9770e;}
  .tdl-badge.status-in_progress{background:#eaf2fd;color:#2471a3;}
  .tdl-badge.status-done{background:#d4edda;color:#155724;}
  .tdl-btn-sm{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;
    border:1px solid var(--border);background:#fff;color:var(--g2);}
  .tdl-btn-sm:hover{background:var(--bg);}
  .tdl-btn-danger{color:var(--red);border-color:#f1948a;}
  .tdl-empty{padding:48px;text-align:center;color:var(--g3);font-size:14px;background:#fff;border-radius:12px;}

  .tdl-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;
    align-items:center;justify-content:center;padding:20px;}
  .tdl-modal-overlay.open{display:flex;}
  .tdl-modal{background:#fff;border-radius:16px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;
    box-shadow:0 20px 60px rgba(0,0,0,.2);}
  .tdl-modal-hdr{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;
    justify-content:space-between;}
  .tdl-modal-hdr h3{font-size:16px;font-weight:700;}
  .tdl-modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--g3);}
  .tdl-modal-body{padding:20px 22px;}
  .tdl-modal-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
  .tdl-field{margin-bottom:14px;}
  .tdl-field label{display:block;font-size:11.5px;font-weight:700;color:var(--g3);margin-bottom:6px;
    text-transform:uppercase;letter-spacing:.4px;}
  .tdl-field input,.tdl-field select,.tdl-field textarea{width:100%;padding:9px 12px;border:1px solid var(--border);
    border-radius:8px;font-size:13px;outline:none;font-family:inherit;}
  .tdl-field input:focus,.tdl-field select:focus,.tdl-field textarea:focus{border-color:var(--red);}
  .tdl-field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .tdl-btn-cancel{padding:9px 16px;border:1px solid var(--border);background:#fff;border-radius:8px;
    font-size:13px;font-weight:600;cursor:pointer;color:var(--g2);}
</style>
</head>
<body>
  <div class="topbar">
    <h1>✅ To-Do List</h1>
    <a href="/" id="back-link">← Back to dashboard</a>
  </div>
  <div class="content">
    <div id="todo-page-root"></div>
  </div>

  <script src="/js/todo-list-common.js"></script>
  <script src="/js/todo-list-page.js"></script>
  <script>
    // Keep "Back to dashboard" pointed at this tenant's app root.
    document.getElementById('back-link').href = '/' + (window.TodoListCommon ? window.TodoListCommon.slug : '');
    TodoListPage.init(document.getElementById('todo-page-root'));
  </script>
</body>
</html>
