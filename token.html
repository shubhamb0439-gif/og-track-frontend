<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>OG Track — Token</title>
<script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.2/dist/socket.io.min.js"></script>
<script>if(typeof io==='undefined')window.io=()=>({on:()=>{},emit:()=>{}});</script>
<style>
  :root{--red:#C0392B;--red2:#E74C3C;--bg:#F5F6FA;--white:#fff;--border:#E8E8E8;--g2:#2C3E50;--g3:#7F8C8D;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  body{background:var(--bg);min-height:100vh;color:var(--g2);}
  .topbar{background:linear-gradient(135deg,#2C3E50,#233140);color:#fff;padding:0 24px;height:58px;
    display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .topbar h1{font-size:16px;font-weight:700;}
  .topbar a{color:#fff;text-decoration:none;font-size:13px;background:rgba(255,255,255,.15);
    padding:6px 14px;border-radius:6px;}
  .topbar a:hover{background:rgba(255,255,255,.25);}
  .content{max-width:920px;margin:0 auto;padding:28px 20px;}

  .tok-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .tok-heading{font-size:18px;font-weight:700;color:var(--g2);}
  .tok-btn-primary{background:var(--red);color:#fff;border:none;padding:9px 18px;border-radius:8px;
    font-size:13px;font-weight:700;cursor:pointer;}
  .tok-btn-primary:hover{opacity:.9;}
  .tok-status{color:var(--red);font-size:13px;margin-bottom:10px;}

  .tok-list{display:flex;flex-direction:column;gap:10px;}
  .tok-row{background:#fff;border-radius:12px;border:1px solid rgba(11,11,11,.06);
    box-shadow:0 1px 2px rgba(20,20,30,.04);padding:14px 16px;display:flex;align-items:center;
    justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .tok-row-left{display:flex;flex-direction:column;gap:3px;flex:1;min-width:220px;}
  .tok-row-title{font-size:14px;font-weight:600;}
  .tok-row-meta{font-size:12px;color:var(--g3);}
  .tok-row-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .tok-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:#EBF5FB;color:#1A5276;}
  .tok-btn-sm{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;
    border:1px solid var(--border);background:#fff;color:var(--g2);}
  .tok-btn-sm:hover{background:var(--bg);}
  .tok-btn-danger{color:var(--red);border-color:#f1948a;}
  .tok-empty{padding:48px;text-align:center;color:var(--g3);font-size:14px;background:#fff;border-radius:12px;}

  .tok-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;
    align-items:center;justify-content:center;padding:20px;}
  .tok-modal-overlay.open{display:flex;}
  .tok-modal{background:#fff;border-radius:16px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;
    box-shadow:0 20px 60px rgba(0,0,0,.2);}
  .tok-modal-hdr{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;
    justify-content:space-between;}
  .tok-modal-hdr h3{font-size:16px;font-weight:700;}
  .tok-modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--g3);}
  .tok-modal-body{padding:20px 22px;}
  .tok-modal-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
  .tok-field{margin-bottom:14px;}
  .tok-field label{display:block;font-size:11.5px;font-weight:700;color:var(--g3);margin-bottom:6px;
    text-transform:uppercase;letter-spacing:.4px;}
  .tok-field input{width:100%;padding:9px 12px;border:1px solid var(--border);
    border-radius:8px;font-size:13px;outline:none;font-family:inherit;}
  .tok-field input:focus{border-color:var(--red);}
  .tok-btn-cancel{padding:9px 16px;border:1px solid var(--border);background:#fff;border-radius:8px;
    font-size:13px;font-weight:600;cursor:pointer;color:var(--g2);}
</style>
</head>
<body>
  <div class="topbar">
    <h1>🔖 Token</h1>
    <a href="/" id="back-link">← Back to dashboard</a>
  </div>
  <div class="content">
    <div id="token-page-root"></div>
  </div>

  <script src="/js/token-common.js"></script>
  <script src="/js/token-page.js"></script>
  <script>
    // Keep "Back to dashboard" pointed at this tenant's app root.
    document.getElementById('back-link').href = '/' + (window.TokenCommon ? window.TokenCommon.slug : '');
    TokenPage.init(document.getElementById('token-page-root'));
  </script>
</body>
</html>
